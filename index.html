<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090914">
<title>DinuVoX — Private Picture House</title>
<style>
:root{--violet:#a98aff;--blue:#7ddcff;--pink:#f18acb;--panel:#151629}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f6f5ff}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:22px;background:
radial-gradient(ellipse at 0% 15%,#6335a866,transparent 36%),
radial-gradient(ellipse at 100% 100%,#075d6860,transparent 35%),
linear-gradient(180deg,#11101d 0%,#080811 68%)}
.ambient{position:fixed;inset:-20%;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,transparent 0 28%,#a17aff0b 38%,transparent 52%,#5bd7ee0b 68%,transparent 82%);filter:blur(38px);animation:ambientTurn 38s linear infinite}
.scene{width:min(100%,960px);perspective:1300px;position:relative;z-index:1}
.panel{position:relative;isolation:isolate;min-height:min(690px,calc(100svh - 44px));padding:clamp(38px,7vw,78px) clamp(24px,8vw,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border:1px solid #9e9acb42;border-radius:34px;background:linear-gradient(145deg,rgba(24,23,48,.97),rgba(18,21,40,.98));box-shadow:0 36px 100px #0009,inset 0 1px #fff1;transform-style:preserve-3d;transition:transform .35s ease,border-color .35s,box-shadow .35s}
.panel:before{content:"";position:absolute;inset:-1px;z-index:-1;background:radial-gradient(480px circle at var(--px,50%) var(--py,38%),#a78bfa20,transparent 65%),linear-gradient(120deg,transparent 30%,#ffffff08 48%,transparent 65%);pointer-events:none}
.panel:after{content:"";position:absolute;inset:0;z-index:-2;border-radius:inherit;background:linear-gradient(120deg,#a78bfa16,transparent 34%,#54d9e815);opacity:.7;animation:panelGlow 8s ease-in-out infinite}
.brand{position:relative;color:#f7f5ff;font-size:clamp(25px,4vw,36px);font-weight:900;letter-spacing:4px;text-shadow:0 0 28px #b9a4ff25;transform:translateZ(35px);animation:brandIn .8s ease both}
.brand-line{width:52px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,#b9a4ff,transparent);opacity:.65}
.eyebrow{margin-top:clamp(42px,7vh,66px);color:#c6b5ff;font-size:11px;font-weight:900;letter-spacing:4px;text-transform:uppercase;transform:translateZ(24px);animation:fadeUp .8s .1s both}
h1{margin:22px 0 0;font-size:clamp(44px,7.5vw,86px);font-weight:850;line-height:1.08;letter-spacing:-3.8px;text-wrap:balance;transform:translateZ(55px);animation:fadeUp .9s .18s both}
h1 em{display:block;margin-top:3px;font-style:normal;background:linear-gradient(105deg,#b79aff 5%,#79d9ff 52%,#f18acb 95%);background-size:200% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:gradientDrift 9s ease-in-out infinite}
.copy{max-width:520px;margin:26px auto 0;color:#b9b8d0;font-size:clamp(14px,1.7vw,17px);line-height:1.75;transform:translateZ(22px);animation:fadeUp .9s .28s both}
.status{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:32px;color:#c8c5df;font-size:11px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;transform:translateZ(28px)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#9c8bff;box-shadow:0 0 0 5px #9c8bff18,0 0 18px #a995ff;animation:dotPulse 1.8s ease-in-out infinite}
.orbit-loader{position:relative;width:56px;height:56px;margin:28px auto 0;transform:translateZ(38px)}
.orbit-loader .ring{position:absolute;inset:0;border:2px solid #ffffff18;border-top-color:#b59aff;border-right-color:#77d9ff;border-radius:50%;animation:spin 1.5s linear infinite}
.orbit-loader .ring:nth-child(2){inset:7px;border-width:1px;border-style:dashed;border-color:#bca9ff70;animation:spin 8s linear infinite reverse}
.orbit-loader .ring:nth-child(3){inset:17px;border:1px solid #79dfff55;box-shadow:0 0 16px #79dfff1c}
.orbit-loader .spark{position:absolute;width:5px;height:5px;left:50%;top:-2px;border-radius:50%;background:#e8c6ff;box-shadow:0 0 12px 3px #a78bfa88;transform-origin:0 29px;animation:spin 2.6s linear infinite}
.actions{min-height:52px;margin-top:24px;transform:translateZ(28px)}
.retry{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:170px;padding:15px 24px;border:1px solid #a99bda55;border-radius:15px;background:linear-gradient(135deg,#a78bfa12,#73d9f30a);color:#f5f2ff;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:1.8px;transition:transform .25s,box-shadow .25s,border-color .25s}
.retry:hover{transform:translateY(-3px);border-color:#bca9ff;box-shadow:0 12px 30px #9279ff24,inset 0 0 20px #a78bfa12}
.retry[hidden]{display:none}
.foot{margin-top:clamp(34px,5vh,50px);color:#797d9f;font-size:10px;letter-spacing:3px;text-transform:uppercase;transform:translateZ(18px);animation:fadeUp 1s .4s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ambientTurn{to{transform:rotate(360deg)}}
@keyframes panelGlow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dotPulse{0%,100%{opacity:.7;box-shadow:0 0 0 4px #9c8bff18,0 0 12px #a995ff}50%{opacity:1;box-shadow:0 0 0 8px #9c8bff08,0 0 22px #a995ff}}
@keyframes gradientDrift{0%,100%{background-position:0% center}50%{background-position:100% center}}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,14px,20px)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes brandIn{from{opacity:0;letter-spacing:10px;transform:translateY(-8px) translateZ(35px)}to{opacity:1;letter-spacing:4px;transform:translateY(0) translateZ(35px)}}
@media(max-width:600px){body{padding:12px}.panel{min-height:calc(100svh - 24px);padding:36px 22px;border-radius:25px}h1{font-size:clamp(42px,10vw,58px);letter-spacing:-2px}.eyebrow{letter-spacing:2.5px;margin-top:42px}.copy{font-size:14px}.foot{letter-spacing:2px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="scene"><section class="panel" id="panel" aria-live="polite">
<div class="brand">ᗪIᑎᑌᐯO᙭</div><div class="brand-line"></div>
<div class="eyebrow">THE PRIVATE PICTURE HOUSE</div>
<h1>Your stories.<em>Your private cinema.</em></h1>
<p class="copy" id="message">Connecting you to the DinuVoX cinema...</p>
<div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Establishing secure connection</span></div>
<div class="orbit-loader" id="loader" aria-label="Connecting"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="spark"></span></div>
<div class="actions"><a class="retry" id="retry" href="/api/launch" hidden>TRY AGAIN <span aria-hidden="true">↗</span></a></div>
<div class="foot">ONE LINK · YOUR PRIVATE COLLECTION</div>
</section></main>
<script>
(()=>{
 const panel=document.getElementById('panel'),message=document.getElementById('message'),statusText=document.getElementById('statusText'),loader=document.getElementById('loader'),retry=document.getElementById('retry');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!reduced&&window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  panel.addEventListener('pointermove',e=>{const b=panel.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;panel.style.setProperty('--px',((x+.5)*100)+'%');panel.style.setProperty('--py',((y+.5)*100)+'%');panel.style.transform='rotateX('+(-y*1.5)+'deg) rotateY('+(x*1.8)+'deg)'});
  panel.addEventListener('pointerleave',()=>panel.style.transform='');
 }
 async function connect(){
  retry.hidden=true;loader.hidden=false;statusText.textContent='Establishing secure connection';message.textContent='Connecting you to the DinuVoX cinema...';
  try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error('Status unavailable');const data=await response.json();
   if(data.online){statusText.textContent='Cinema online · redirecting';message.textContent='Your private screening room is ready. Opening the latest server address...';window.location.replace('/api/launch');return}
   statusText.textContent='Cinema currently offline';message.textContent='Your permanent link is working, but the DinuVoX server is offline. Ask the owner to start the laptop server, then try again.';
  }catch(e){statusText.textContent='Connection unavailable';message.textContent='We could not reach the cinema status service. Check your connection and try again.'}
  loader.hidden=true;retry.hidden=false;
 }
 retry.addEventListener('click',e=>{e.preventDefault();connect()});connect();
})();
</script>
</body></html>
